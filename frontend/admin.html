<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Management - Thonburi Phanich</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <style>
      body {
        background-color: #f4f7f9;
        font-family: "Prompt", sans-serif;
      }
      .admin-section {
        padding: 40px 0;
      }
      .table-card {
        background: white;
        border-radius: 15px;
        padding: 25px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        border: none;
      }
      .config-preview {
        width: 80px;
        height: 50px;
        object-fit: cover;
        border-radius: 8px;
      }
      .nav-tabs-custom .nav-link {
        border: none;
        color: #718096;
        font-weight: 500;
        padding: 12px 20px;
        border-bottom: 3px solid transparent;
      }
      .nav-tabs-custom .nav-link.active {
        color: #0d6efd;
        border-bottom-color: #0d6efd;
      }
      .detail-item {
        padding: 8px 0;
        border-bottom: 1px solid #edf2f7;
      }
      .detail-label {
        font-weight: 600;
        color: #4a5568;
        font-size: 0.85rem;
        width: 180px;
        display: inline-block;
      }
      .input-preview {
        width: 100%;
        height: 80px;
        object-fit: cover;
        border-radius: 6px;
        margin-top: 8px;
        border: 1px dashed #ced4da;
        background: #f8f9fa;
        display: none;
      }
      .input-preview.active {
        display: block;
      }
    </style>
  </head>
  <body>
    <section class="database-selector-section py-2">
      <div class="container-fluid px-4">
        <div class="d-flex justify-content-between align-items-center">
          <div class="d-flex gap-2">
            <a href="index.html" class="btn btn-outline-light btn-sm"
              ><i class="bi bi-speedometer2"></i> Dashboard</a
            >
            <a href="event_mgmt.html" class="btn btn-outline-light btn-sm"
              ><i class="bi bi-people-fill"></i> Event Mgmt</a
            >
          </div>
          <span class="text-white fw-bold">ADMIN CONSOLE (Benz-info)</span>
        </div>
      </div>
    </section>

    <div class="container-fluid admin-section px-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="fw-bold text-dark">โครงสร้างระบบโชว์รูม</h2>
          <p class="text-muted mb-0">
            จัดการรูปภาพและข้อความให้ตรงตามงานอีเวนต์ (รองรับ 35 ฟิลด์)
          </p>
        </div>
        <button
          class="btn btn-primary btn-add"
          data-bs-toggle="modal"
          data-bs-target="#uploadModal"
        >
          <i class="bi bi-plus-lg me-1"></i> เพิ่มงานใหม่
        </button>
      </div>

      <div class="card table-card">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr>
                <th>#</th>
                <th>DB Name</th>
                <th>Label</th>
                <th>Header Text</th>
                <th>Preview</th>
                <th class="text-center">Action</th>
              </tr>
            </thead>
            <tbody id="configTableBody">
              <tr>
                <td colspan="6" class="text-center py-5">กำลังโหลดข้อมูล...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="modal fade" id="uploadModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered modal-xl">
        <div class="modal-content border-0 shadow-lg">
          <form id="uploadForm">
            <input type="hidden" name="config_id" id="config_id" />
            <div class="modal-header bg-dark text-white">
              <h5 class="modal-title fw-bold" id="modalTitle">
                เพิ่มข้อมูลใหม่
              </h5>
              <button
                type="button"
                class="btn-close btn-close-white"
                data-bs-dismiss="modal"
              ></button>
            </div>
            <div class="modal-body p-0">
              <ul class="nav nav-tabs nav-tabs-custom px-4 border-bottom">
                <li class="nav-item">
                  <button
                    class="nav-link active"
                    data-bs-toggle="tab"
                    data-bs-target="#t1"
                    type="button"
                  >
                    1. หัวข้อ & แบนเนอร์
                  </button>
                </li>
                <li class="nav-item">
                  <button
                    class="nav-link"
                    data-bs-toggle="tab"
                    data-bs-target="#t2"
                    type="button"
                  >
                    2. กล้อง CCTV (1-8)
                  </button>
                </li>
                <li class="nav-item">
                  <button
                    class="nav-link"
                    data-bs-toggle="tab"
                    data-bs-target="#t3"
                    type="button"
                  >
                    3. รูปรถ & ผังงาน
                  </button>
                </li>
              </ul>
              <div class="tab-content p-4">
                <div class="tab-pane fade show active" id="t1">
                  <div class="row g-3">
                    <div class="col-md-6">
                      <label class="small fw-bold">DB Name (ID) *</label
                      ><input
                        type="text"
                        name="database_name"
                        class="form-control"
                        required
                      />
                    </div>
                    <div class="col-md-6">
                      <label class="small fw-bold">DB Label (Display) *</label
                      ><input
                        type="text"
                        name="database_label"
                        class="form-control"
                        required
                      />
                    </div>
                    <div class="col-md-4">
                      <label class="small fw-bold text-primary">R1 Logo</label
                      ><input
                        type="file"
                        name="img_header"
                        class="form-control"
                        accept="image/*"
                      />
                      <img
                        id="prev_img_header"
                        class="input-preview shadow-sm"
                      />
                    </div>
                    <div class="col-md-4">
                      <label class="small fw-bold">R1 Text</label
                      ><input
                        type="text"
                        name="txt_header"
                        class="form-control"
                      />
                    </div>
                    <div class="col-md-4">
                      <label class="small fw-bold">R1 Detail</label
                      ><input
                        type="text"
                        name="txt_header_detail"
                        class="form-control"
                      />
                    </div>
                    <div class="col-md-12">
                      <label class="small fw-bold text-primary"
                        >R2 Banner Image</label
                      ><input
                        type="file"
                        name="img_header2"
                        class="form-control"
                        accept="image/*"
                      />
                      <img
                        id="prev_img_header2"
                        class="input-preview shadow-sm"
                      />
                    </div>
                    <div class="col-md-6">
                      <label class="small fw-bold">R2 Hero Text</label
                      ><input
                        type="text"
                        name="txt_header2"
                        class="form-control"
                      />
                    </div>
                    <div class="col-md-6">
                      <label class="small fw-bold">R2 Hero Sub</label
                      ><input
                        type="text"
                        name="txt_header2_detail"
                        class="form-control"
                      />
                    </div>
                  </div>
                </div>
                <div class="tab-pane fade" id="t2">
                  <div class="row g-3" id="cctvInputs"></div>
                </div>
                <div class="tab-pane fade" id="t3">
                  <h6 class="fw-bold py-2 border-bottom">รูปรถแต่ละคัน</h6>
                  <div class="row g-3 mb-4" id="carInputs"></div>
                  <h6 class="fw-bold py-2 border-bottom">Layout (Row 10)</h6>
                  <div class="row g-3">
                    <div class="col-md-8">
                      <label class="small fw-bold">ภาพผังงาน</label
                      ><input
                        type="file"
                        name="img_body"
                        class="form-control"
                        accept="image/*"
                      />
                      <img id="prev_img_body" class="input-preview shadow-sm" />
                    </div>
                    <div class="col-md-4">
                      <label class="small fw-bold">หัวข้อผัง</label
                      ><input
                        type="text"
                        name="txt_body"
                        class="form-control"
                      />
                    </div>
                    <div class="col-12">
                      <label class="small fw-bold">รายละเอียดผัง</label
                      ><textarea
                        name="txt_body_detail"
                        class="form-control"
                        rows="2"
                      ></textarea>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="modal-footer bg-light">
              <button
                type="button"
                class="btn btn-light"
                data-bs-dismiss="modal"
              >
                ยกเลิก
              </button>
              <button type="submit" class="btn btn-dark" id="btnSubmit">
                <span
                  class="spinner-border spinner-border-sm d-none me-2"
                  id="submitSpinner"
                ></span
                ><span id="btnSubmitText">บันทึกข้อมูล</span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="modal fade" id="detailModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow-lg">
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title fw-bold">รายละเอียดทั้งหมด</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div
            class="modal-body p-0"
            id="detailContent"
            style="max-height: 70vh; overflow-y: auto"
          ></div>
          <div class="modal-footer bg-light">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              ปิด
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
      // Generate inputs for CCTV and Cars
      let cctvHtml = "",
        carHtml = "";
      for (let i = 1; i <= 8; i++) {
        cctvHtml += `<div class="col-md-3"><div class="p-2 border rounded bg-white"><b>Cam ${i}</b><input type="text" name="detail_link${i}" class="form-control form-control-sm mb-1" placeholder="Label"><input type="file" name="img_link${i}" class="form-control form-control-sm" accept="image/*"><img id="prev_img_link${i}" class="input-preview"></div></div>`;
        carHtml += `<div class="col-md-3"><div class="p-2 border rounded bg-white small fw-bold">รถคันที่ ${i}<input type="text" name="detail_car${i}" class="form-control form-control-sm mb-1 mt-1" placeholder="ชื่อรุ่นรถ"><input type="file" name="car_img${i}" class="form-control form-control-sm" accept="image/*"><img id="prev_car_img${i}" class="input-preview"></div></div>`;
      }
      document.getElementById("cctvInputs").innerHTML = cctvHtml;
      document.getElementById("carInputs").innerHTML = carHtml;
    </script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/admin.js"></script>
  </body>
</html>
